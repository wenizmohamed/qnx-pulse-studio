name: QNX Pulse Real-Time CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  qnx-rt-audit:
    name: QNX Neutrino 8.0 RT Trace & Multi-Hop PI Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (zero runtime dependencies)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run deterministic kernel analyzer test suite
        run: npm test

      - name: Gate clean QNX 8.0 capture (must PASS exit 0) & emit SARIF + JUnit
        run: |
          mkdir -p reports
          node cli/qnx-pulse.mjs analyze samples/surgical-arm-clean \
            --deadline 500 \
            --format sarif \
            --out reports/qnx-surgical-clean.sarif
          node cli/qnx-pulse.mjs analyze samples/surgical-arm-clean \
            --deadline 500 \
            --format junit \
            --out reports/qnx-surgical-clean.junit.xml

      - name: Verify RT regression detection on multi-hop PI & brake ECU captures (must exit 2)
        run: |
          set +e
          node cli/qnx-pulse.mjs analyze samples/adas-multihop-pi \
            --deadline 500 \
            --format sarif \
            --out reports/qnx-adas-multihop.sarif
          rc_mh=$?
          node cli/qnx-pulse.mjs analyze samples/brake-ecu-inversion \
            --deadline 500 \
            --format junit \
            --out reports/qnx-brake-ecu.junit.xml
          rc_ecu=$?
          set -e
          if [ "$rc_mh" -ne 2 ] || [ "$rc_ecu" -ne 2 ]; then
            echo "Expected exit code 2 on fault fixtures, got multihop=$rc_mh ecu=$rc_ecu"
            exit 1
          fi

      - name: Upload SARIF 2.1.0 report to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/qnx-surgical-clean.sarif
          category: qnx-pulse-rt-gate

      - name: Upload JUnit & SARIF artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qnx-pulse-ci-reports
          path: reports/
